<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모성보호 일정추출기</title><link rel="stylesheet" href="css/app.css"></head><body>
<header><h1>모성보호 일정추출기</h1><span class="upd" id="upd"></span></header>
<main>
<section class="card"><h2 data-ic="📝">기본정보 입력</h2><div class="grid">
<label>출산예정일*<input type="date" id="edd"></label><label>실제 출산일(선택)<input type="date" id="birth"></label>
<label>임신 유형*<select id="multiple"><option value="0">단태아</option><option value="1">다태아</option></select></label>
<label>1일 소정근로시간*<input type="number" id="hours" value="8" min="1" max="8" step="0.5"></label>
<label>육아휴직 사용기간(개월)<input type="number" id="months" value="12" min="1" max="24"></label></div>
<div class="grid" style="margin-top:10px"><label class="ck"><input type="checkbox" id="prem">미숙아 출산 (실제 출산일 입력 후 증빙 확인)</label>
<label class="ck"><input type="checkbox" id="hr">고위험 임신 (진단서 등 확인 필요)</label><label class="ck"><input type="checkbox" id="linked" checked>출산휴가 후 육아휴직 연속 사용</label></div>
<button id="go">일정 생성</button> </section>
<div id="res" hidden><section class="card"><h2 data-ic="📅">일정 요약</h2><div class="cards" id="sum"></div><div id="warns"></div></section>
<section class="card"><h2 data-ic="🗓️">타임라인</h2><div id="tl"></div></section>
<section class="card"><h2 data-ic="📋">상세 일정표</h2><div class="wrap"><table><thead><tr><th>구분</th><th>시작일</th><th>종료일</th><th>기간</th><th>상태</th><th>적용 제도·근거</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
<p class="note">근거: 근로기준법 제74조 (<a href="https://www.law.go.kr/법령/근로기준법" target="_blank" rel="noopener">국가법령정보센터</a>) · 임신기 단축(12주 이내/32주 이후, 고위험 전 기간) 안내 <a href="https://www.korea.kr/news/policyNewsView.do?newsId=148940076" target="_blank" rel="noopener">정책브리핑</a></p></section>
</div>
</main>
<footer>본 서비스는 인사담당자의 모성보호 일정 및 업무 관리를 돕기 위한 참고 도구입니다. 실제 적용 시에는 근로자의 상황과 관련 법령 및 행정기관의 최신 안내를 확인해야 합니다.<br>© 2026. KIMHANSOL All rights reserved.</footer>
<dialog id="dlg"><form method="dialog"><h2 id="dl-t"></h2><label>시작일<input type="date" id="d-s"></label><label>종료일<input type="date" id="d-e"></label><p class="note" id="d-sg"></p>
<div class="row"><button type="button" class="sec" id="d-reset">자동값으로 복원</button><button value="cancel" class="sec">취소</button><button id="d-save" value="ok">저장</button></div></form></dialog>
<script src="js/date-utils.js"></script><script src="js/regulations.js"></script><script src="js/leave-calculator.js"></script><script src="js/app.js"></script>
</body></html>
